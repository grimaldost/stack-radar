[project]
name = "stack-radar"
version = "0.2.1"
description = "A tech radar for a Claude Code stack: adoption state, evidence-gated ring transitions, and the gate behind them"
requires-python = ">=3.11"

# EMPTY, AND IT IS A CONSTRAINT RATHER THAN AN ACCIDENT. The commands are meant to run
# where installing anything may need approval, so a runtime dependency would be a new
# precondition for every command - and it is what makes the fallback work: where a wheel
# cannot be installed at all, `PYTHONPATH=<checkout>/src python -m stack_radar.cli` is a
# complete installation. Everything here is stdlib on Python 3.11 (`tomllib` is the floor).
dependencies = []

license = "MIT"
license-files = ["LICENSE"]
# What a package index renders on the project's page. A key naming a file that does not
# exist fails the BUILD, which is loud; an ABSENT key ships a project page with no
# description at all, which is silent - so `tests/test_docs.py` asserts the key rather than
# leaving the build to assert only the file.
readme = "README.md"

[project.scripts]
radar = "stack_radar.cli:main"

[dependency-groups]
# This repository's own suite, linting and commit lane, which only ever run on a machine
# that has uv. They are NOT runtime dependencies - see `dependencies` above. `pre-commit`
# is here because the tracked hooks in `.githooks/` run it as
# `uv run --frozen python -m pre_commit`.
dev = [
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.13",
  "ty>=0.0.63",
]

[build-system]
# Pinned. A build of the engine from its git source - `uv build` in this repository's CI,
# `uvx --from git+...` in every catalogue's - fetches the build backend from the package
# index, and an unpinned one is whatever was published last. The `uv` entry in
# .github/dependabot.yml proposes each new version, after its cooldown.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stack_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `pythonpath` here, and the absence is the point: this is a `src/` layout and `uv sync`
# installs the project into the environment, so the suite imports `stack_radar` the way an
# operator's machine does. A `pythonpath = ["src"]` would import the checkout directly and
# quietly stop exercising the packaging - which is the half that breaks on the day someone
# else installs it.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
